name: Build and validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - name: Tests and lint
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-gnome-companion.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build packages
        run: |
          dotnet tool install wix --version 6.0.2 --tool-path target/tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$PWD/target/tools;$env:PATH"
          ./scripts/build-windows.ps1
      - name: Portable smoke test
        run: |
          & ./dist/easy-switch-link-0.3.4-windows-x64.exe --help | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: MSI install and uninstall smoke test
        run: |
          $msi = (Resolve-Path ./dist/easy-switch-link-0.3.4-windows-x64.msi).Path
          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -notin @(0,3010)) { throw "MSI install failed: $($install.ExitCode)" }
          & "$env:LOCALAPPDATA/Easy-Switch Link/easy-switch-link.exe" --version | Out-String
          $remove = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru -WindowStyle Hidden
          if ($remove.ExitCode -notin @(0,3010)) { throw "MSI uninstall failed: $($remove.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.msi
            dist/*-gnome.shell-extension.zip
            dist/SHA256SUMS-windows.txt
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    steps:
      - name: Build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential curl ca-certificates git python3 python3-gi dbus systemd pkg-config libudev-dev libxkbcommon-dev libxkbcommon-x11-0 libegl1-mesa-dev libgl1-mesa-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.98.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Tests and lint
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Packages
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          bash scripts/build-linux.sh '${{ matrix.target }}'
      - name: Package and portable smoke tests
        run: |
          dist/easy-switch-link-0.3.4-linux-${{ matrix.arch }} --help
          dpkg-deb --info dist/easy-switch-link_0.3.4_${{ matrix.arch }}.deb
          apt-get install -y ./dist/easy-switch-link_0.3.4_${{ matrix.arch }}.deb
          easy-switch-link --version
          easy-switch-link --config-dir /tmp/esl-smoke run --headless &
          monitor=$!
          sleep 2
          easy-switch-link --config-dir /tmp/esl-smoke status --json
          easy-switch-link --config-dir /tmp/esl-smoke quit
          wait "$monitor"
          apt-get remove -y easy-switch-link
          ESL_DISPOSABLE_ROOT=1 dbus-run-session -- python3 scripts/test-tray-startup.py dist/easy-switch-link-0.3.4-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/easy-switch-link-0.3.4-linux-${{ matrix.arch }}
            dist/*_${{ matrix.arch }}.deb
            dist/SHA256SUMS-linux-${{ matrix.arch }}.txt
