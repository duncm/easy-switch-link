[workspace]
members = ["crates/core", "crates/platform", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.3.4"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/duncm/easy-switch-link"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
crossbeam-channel = "0.5"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

