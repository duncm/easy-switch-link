[package]
name = "easy-switch-link"
description = "Synchronize Logitech Easy-Switch devices through Bolt and Unifying receivers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
ui-snapshot = ["eframe/__screenshot"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
sha2 = "0.10"
rand = "0.9"
mdns-sd = "0.17"
easy-switch-core = { path = "../core" }
easy-switch-platform = { path = "../platform" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
clap = { version = "4.6", features = ["derive"] }
directories = "6"
tempfile = "3"
fs2 = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
interprocess = { version = "2.4", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }
widestring = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"

[build-dependencies]
winresource = "0.1"

[package.metadata.deb]
maintainer = "Duncan Maitland"
copyright = "2026 Duncan Maitland"
license-file = ["../../LICENSE", "0"]
depends = "$auto, python3, libxkbcommon0, libxkbcommon-x11-0, libegl1, libgl1, libx11-6, libxi6, libxrandr2, libxcursor1, libwayland-client0, libwayland-cursor0, libwayland-egl1"
section = "utils"
priority = "optional"
assets = [
  ["../../packaging/linux/easy-switch-link-hardware.service", "usr/lib/systemd/system/", "644"],
  ["../../packaging/linux/easy-switch-link-peer.service", "usr/lib/systemd/system/", "644"],
  ["../../packaging/linux/easy-switch-link.sysusers", "usr/lib/sysusers.d/easy-switch-link.conf", "644"],
  ["../../packaging/linux/service-admin", "usr/lib/easy-switch-link/service-admin", "755"],
  ["../../packaging/gnome/easy-switch-link@duncm.github.com/metadata.json", "usr/share/gnome-shell/extensions/easy-switch-link@duncm.github.com/metadata.json", "644"],
  ["../../packaging/gnome/easy-switch-link@duncm.github.com/extension.js", "usr/share/gnome-shell/extensions/easy-switch-link@duncm.github.com/extension.js", "644"],
  ["target/release/easy-switch-link", "usr/bin/", "755"],
  ["../../packaging/linux/70-easy-switch-link.rules", "usr/lib/udev/rules.d/", "644"],
  ["../../packaging/linux/easy-switch-link.desktop", "usr/share/applications/", "644"],
  ["../../packaging/linux/easy-switch-link.service", "usr/lib/systemd/user/", "644"],
  ["../../assets/easy-switch-link.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["../../docs/DESTINATION-FOLLOWS-MOUSE.md", "usr/share/doc/easy-switch-link/docs/DESTINATION-FOLLOWS-MOUSE.md", "644"],
  ["../../docs/VALIDATION.md", "usr/share/doc/easy-switch-link/docs/VALIDATION.md", "644"],
  ["../../docs/SYSTEM-SERVICE.md", "usr/share/doc/easy-switch-link/docs/SYSTEM-SERVICE.md", "644"],
  ["../../README.md", "usr/share/doc/easy-switch-link/README.md", "644"],
]
maintainer-scripts = "../../packaging/linux"
