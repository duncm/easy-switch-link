[package]
name = "easy-switch-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["sync"] }
easy-switch-core = { path = "../core" }
anyhow.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Magnification", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops"] }

[target.'cfg(target_os = "linux")'.dependencies]
udev = "0.9"
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }


[target.'cfg(target_os = "linux")'.dependencies.x11rb]
version = "0.13"
features = ["randr", "xfixes", "xinput", "screensaver"]

[target.'cfg(target_os = "linux")'.dependencies.ashpd]
version = "0.13"
default-features = false
features = ["tokio", "input_capture", "remote_desktop", "screencast"]

[target.'cfg(target_os = "linux")'.dependencies.reis]
version = "0.7"
features = ["tokio"]

[target.'cfg(target_os = "linux")'.dependencies.tokio]
version = "1"
features = ["rt", "macros", "time", "net", "sync"]

[target.'cfg(target_os = "linux")'.dependencies.futures-util]
version = "0.3"
